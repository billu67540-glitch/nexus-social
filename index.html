<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Social</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #080a10;
    color: white;
    min-height: 100vh;
}

header {
    height: 70px;
    background: #0d0f17;
    border-bottom: 1px solid #20232e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: bold;
}

.logo-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg,#00c6ff,#7148ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.channel {
    background: #191c27;
    padding: 9px 15px;
    border-radius: 12px;
    color: #00d9ff;
}

.profile {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #744cff;
    background: url("https://i.pravatar.cc/100?img=12") center/cover;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px 100px;
}

.create-box {
    background: #11141d;
    border: 1px solid #252936;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 25px;
}

textarea {
    width: 100%;
    min-height: 90px;
    resize: none;
    background: #080a10;
    color: white;
    border: 1px solid #252936;
    border-radius: 15px;
    padding: 15px;
    font-size: 16px;
    outline: none;
}

textarea:focus {
    border-color: #6751ff;
}

.create-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
}

input[type="file"] {
    display: none;
}

.upload {
    background: #191d27;
    padding: 11px 15px;
    border-radius: 12px;
    cursor: pointer;
    color: #00d9ff;
}

button {
    border: none;
    cursor: pointer;
}

.publish {
    background: linear-gradient(135deg,#6245ff,#7947ff);
    color: white;
    padding: 12px 24px;
    border-radius: 13px;
    font-weight: bold;
    box-shadow: 0 0 18px #664cff55;
}

.post {
    background: #151823;
    border: 1px solid #242735;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
}

.user {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: url("https://i.pravatar.cc/100?img=12") center/cover;
    border: 2px solid #624cff;
}

.username {
    font-weight: bold;
}

.verified {
    background: #087e68;
    color: #52ffcf;
    font-size: 11px;
    padding: 4px 7px;
    border-radius: 6px;
    margin-left: 5px;
}

.time {
    color: #777d8d;
    font-size: 13px;
    margin-top: 4px;
}

.post-text {
    margin: 18px 0;
    font-size: 16px;
}

.post-image {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    border-radius: 16px;
    margin-top: 5px;
}

.reactions {
    border-top: 1px solid #292c38;
    margin-top: 18px;
    padding-top: 12px;
    display: flex;
    gap: 10px;
}

.react {
    background: #1b1e29;
    color: #aeb4c4;
    border-radius: 10px;
    padding: 9px 16px;
}

.react:hover {
    background: #252936;
}

nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #090b11;
    border-top: 1px solid #22252e;
    display: flex;
    justify-content: center;
    gap: 70px;
    z-index: 20;
}

.nav-item {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #777d8c;
    cursor: pointer;
    gap: 5px;
}

.nav-item.active {
    color: #00d9ff;
}

.nav-icon {
    font-size: 22px;
}

.empty {
    text-align: center;
    color: #707687;
    padding: 50px 0;
}

@media(max-width:600px) {
    header {
        padding: 0 12px;
    }

    .channel {
        display: none;
    }

    .container {
        padding: 18px 10px 90px;
    }

    nav {
        gap: 35px;
    }

    .post {
        border-radius: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-icon">ϟ</div>
        NEXUS
    </div>

    <div class="channel">
        ☰ #general
    </div>

    <div class="profile"></div>
</header>


<main class="container">

    <section class="create-box">

        <textarea id="postText"
        placeholder="What is happening in your matrix?"></textarea>

        <div class="create-actions">

            <label class="upload">
                🖼️ Add Photo
                <input id="photoInput" type="file" accept="image/*">
            </label>

            <button class="publish" onclick="createPost()">
                △ Publish
            </button>

        </div>

    </section>


    <section id="feed">

        <article class="post">

            <div class="user">

                <div class="avatar"></div>

                <div>
                    <div class="username">
                        CyberGuest
                        <span class="verified">Verified</span>
                    </div>

                    <div class="time">Just now</div>
                </div>

            </div>

            <div class="post-text">
                Lol
            </div>

            <img
            class="post-image"
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1000&q=80">

            <div class="reactions">

                <button class="react" onclick="like(this)">
                    👍 <span>0</span>
                </button>

                <button class="react" onclick="love(this)">
                    💗 <span>0</span>
                </button>

                <button class="react">
                    💬 <span>0</span>
                </button>

            </div>

        </article>

    </section>

</main>


<nav>

    <div class="nav-item active">
        <div class="nav-icon">▣</div>
        <small>Feed</small>
    </div>

    <div class="nav-item" onclick="showMessage()">
        <div class="nav-icon">💬</div>
        <small>Chat</small>
    </div>

    <div class="nav-item" onclick="showMessage()">
        <div class="nav-icon">♧</div>
        <small>Friends</small>
    </div>

    <div class="nav-item" onclick="showMessage()">
        <div class="nav-icon">♙</div>
        <small>Profile</small>
    </div>

</nav>


<script>

let selectedImage = null;

const photoInput = document.getElementById("photoInput");

photoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        selectedImage = e.target.result;
    };

    reader.readAsDataURL(file);
});


function createPost() {

    const text = document.getElementById("postText").value.trim();

    if (!text && !selectedImage) {
        alert("Write something or add a photo first!");
        return;
    }

    const post = document.createElement("article");

    post.className = "post";

    post.innerHTML = `

        <div class="user">

            <div class="avatar"></div>

            <div>
                <div class="username">
                    Raiyan
                    <span class="verified">Verified</span>
                </div>

                <div class="time">Just now</div>
            </div>

        </div>

        ${text ? `<div class="post-text">${escapeHTML(text)}</div>` : ""}

        ${selectedImage ?
        `<img class="post-image" src="${selectedImage}">`
        : ""}

        <div class="reactions">

            <button class="react" onclick="like(this)">
                👍 <span>0</span>
            </button>

            <button class="react" onclick="love(this)">
                💗 <span>0</span>
            </button>

            <button class="react">
                💬 <span>0</span>
            </button>

        </div>
    `;

    document.getElementById("feed").prepend(post);

    document.getElementById("postText").value = "";

    photoInput.value = "";

    selectedImage = null;
}


function like(button) {

    const number = button.querySelector("span");

    number.textContent =
        Number(number.textContent) + 1;
}


function love(button) {

    const number = button.querySelector("span");

    number.textContent =
        Number(number.textContent) + 1;
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function showMessage() {

    alert(
        "Chat/Friends/Profile will need a backend to work between different users."
    );

}

</script>

</body>
</html>
