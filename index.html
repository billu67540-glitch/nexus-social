<script type="module">
  // 1. Import initializeApp and Database modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 2. Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBT4dUvqLsl6ca7JdHsie5KW6ps1z_ph4w",
    authDomain: "nexus-social-b30de.firebaseapp.com",
    databaseURL: "https://nexus-social-b30de-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nexus-social-b30de",
    storageBucket: "nexus-social-b30de.firebasestorage.app",
    messagingSenderId: "704218228308",
    appId: "1:704218228308:web:8afe2664591950e55defc1"
  };

  // 3. Initialize Firebase & Database
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Example: Function to add a post
  function createPost(username, text) {
    const postsRef = ref(db, 'posts');
    push(postsRef, {
      username: username,
      text: text,
      timestamp: Date.now()
    });
  }

  // Example: Listen for new posts in real-time
  const postsRef = ref(db, 'posts');
  onValue(postsRef, (snapshot) => {
    const data = snapshot.val();
    console.log("Realtime Posts:", data);
    // Here you can render posts directly onto your page HTML!
  });
        </script>
