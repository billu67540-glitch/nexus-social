<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Social</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding-bottom: 70px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #38bdf8; }
        main { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .create-post { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .create-post input[type="text"], .create-post textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; }
        
        /* Image Upload Styling */
        .file-label { display: block; background: #0f172a; border: 1px dashed #38bdf8; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 10px; cursor: pointer; color: #38bdf8; font-size: 0.9rem; }
        .file-label input { display: none; }
        
        .create-post button { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; }

        article { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f172a; }
        .username { font-weight: bold; }
        .time { font-size: 0.8rem; color: #94a3b8; }
        .post-text { margin-bottom: 10px; line-height: 1.4; word-break: break-word; }
        .post-img { width: 100%; border-radius: 8px; margin-bottom: 10px; max-height: 350px; object-fit: cover; }
        .like-btn { background: #334155; border: none; color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }

        #chat-section { display: none; }
        .chat-box { background: #1e293b; border-radius: 12px; border: 1px solid #334155; height: 60vh; display: flex; flex-direction: column; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #0f172a; padding: 8px 12px; border-radius: 8px; max-width: 80%; width: fit-content; word-break: break-word; }
        .msg-user { font-size: 0.75rem; color: #38bdf8; font-weight: bold; }
        .chat-input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; }
        .chat-input-area button { padding: 10px 15px; background: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #334155; z-index: 100; }
        nav div { text-align: center; color: #94a3b8; cursor: pointer; }
        nav div.active { color: #38bdf8; }
        nav small { display: block; font-size: 0.75rem; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ NEXUS</div>
        <div id="header-title">Feed</div>
        <div></div>
    </header>

    <main>
        <div id="feed-section">
            <div class="create-post">
                <input type="text" id="usernameInput" placeholder="তোমার নাম (Name)">
                <textarea id="postInput" rows="2" placeholder="কী ভাবছো বলো..."></textarea>
                
                <!-- File Upload Input -->
                <label class="file-label" id="fileLabel">
                    📷 গ্যালারি থেকে ছবি বেছে নাও
                    <input type="file" id="imageFileInput" accept="image/*">
                </label>
                
                <button id="postBtn">পোস্ট করো</button>
            </div>

            <section id="posts-container">
                <p style="text-align: center; color: #94a3b8;">পোস্ট লোড হচ্ছে...</p>
            </section>
        </div>

        <div id="chat-section">
            <div class="chat-box">
                <div class="messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatMsgInput" placeholder="মেসেজ লেখো...">
                    <button id="sendChatBtn">Send</button>
                </div>
            </div>
        </div>
    </main>

    <nav>
        <div id="nav-feed" class="active"><div>🏠</div><small>Feed</small></div>
        <div id="nav-chat"><div>💬</div><small>Chat</small></div>
    </nav>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBT4dUvqLsl6ca7JdHsie5KW6ps1z_ph4w",
        authDomain: "nexus-social-b30de.firebaseapp.com",
        databaseURL: "https://nexus-social-b30de-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "nexus-social-b30de",
        storageBucket: "nexus-social-b30de.firebasestorage.app",
        messagingSenderId: "704218228308",
        appId: "1:704218228308:web:8afe2664591950e55defc1"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const feedSection = document.getElementById('feed-section');
      const chatSection = document.getElementById('chat-section');
      const navFeed = document.getElementById('nav-feed');
      const navChat = document.getElementById('nav-chat');
      const headerTitle = document.getElementById('header-title');

      navFeed.addEventListener('click', () => {
        feedSection.style.display = "block";
        chatSection.style.display = "none";
        navFeed.classList.add('active');
        navChat.classList.remove('active');
        headerTitle.innerText = "Feed";
      });

      navChat.addEventListener('click', () => {
        feedSection.style.display = "none";
        chatSection.style.display = "block";
        navChat.classList.add('active');
        navFeed.classList.remove('active');
        headerTitle.innerText = "Global Chat";
      });

      const usernameInput = document.getElementById('usernameInput');
      const postInput = document.getElementById('postInput');
      const imageFileInput = document.getElementById('imageFileInput');
      const fileLabel = document.getElementById('fileLabel');
      const postBtn = document.getElementById('postBtn');
      const postsContainer = document.getElementById('posts-container');

      imageFileInput.addEventListener('change', () => {
        if(imageFileInput.files[0]) {
          fileLabel.innerText = "✅ ছবি সিলেক্ট হয়েছে: " + imageFileInput.files[0].name;
        }
      });

      postBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim() || "Guest";
        const text = postInput.value.trim();
        const file = imageFileInput.files[0];

        if (!text && !file) return;

        postBtn.innerText = "আপলোড হচ্ছে...";
        postBtn.disabled = true;

        let uploadedImgUrl = "";

        // Upload to ImgBB via free API key
        if (file) {
          const formData = new FormData();
          formData.append("image", file);

          try {
            const res = await fetch("https://api.imgbb.com/1/upload?key=6d207e02198a847aa98d0a2a901485a5", {
              method: "POST",
              body: formData
            });
            const data = await res.json();
            if (data.success) {
              uploadedImgUrl = data.data.url;
            }
          } catch (err) {
            alert("ছবি আপলোড করতে সমস্যা হয়েছে!");
          }
        }

        // Push to Firebase
        push(ref(db, 'posts'), {
          username: username,
          text: text,
          imgUrl: uploadedImgUrl,
          likes: 0,
          timestamp: Date.now()
        });

        postInput.value = "";
        imageFileInput.value = "";
        fileLabel.innerHTML = "📷 গ্যালারি থেকে ছবি বেছে নাও";
        postBtn.innerText = "পোস্ট করো";
        postBtn.disabled = false;
      });

      onValue(ref(db, 'posts'), (snapshot) => {
        postsContainer.innerHTML = "";
        const data = snapshot.val();
        if (data) {
          const keys = Object.keys(data).reverse();
          keys.forEach(key => {
            const post = data[key];
            const currentLikes = post.likes || 0;
            const article = document.createElement('article');
            article.innerHTML = `
              <div class="user-info">
                <div class="avatar">${post.username.charAt(0).toUpperCase()}</div>
                <div>
                  <div class="username">${post.username}</div>
                  <div class="time">${new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                </div>
              </div>
              ${post.text ? `<div class="post-text">${post.text}</div>` : ''}
              ${post.imgUrl ? `<img src="${post.imgUrl}" class="post-img" alt="Post Image">` : ''}
              <button class="like-btn" onclick="window.likePost('${key}', ${currentLikes})">❤️ ${currentLikes} Likes</button>
            `;
            postsContainer.appendChild(article);
          });
        } else {
          postsContainer.innerHTML = '<p style="text-align: center; color: #94a3b8;">কোনো পোস্ট নেই</p>';
        }
      });

      window.likePost = (key, currentLikes) => {
        set(ref(db, `posts/${key}/likes`), currentLikes + 1);
      };

      const chatMsgInput = document.getElementById('chatMsgInput');
      const sendChatBtn = document.getElementById('sendChatBtn');
      const chatMessages = document.getElementById('chat-messages');

      sendChatBtn.addEventListener('click', () => {
        const msgText = chatMsgInput.value.trim();
        const username = usernameInput.value.trim() || "Guest";
        if (msgText) {
          push(ref(db, 'chats'), {
            username: username,
            message: msgText,
            timestamp: Date.now()
          });
          chatMsgInput.value = "";
        }
      });

      onValue(ref(db, 'chats'), (snapshot) => {
        chatMessages.innerHTML = "";
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(msg => {
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg";
            msgDiv.innerHTML = `
              <div class="msg-user">${msg.username}</div>
              <div>${msg.message}</div>
            `;
            chatMessages.appendChild(msgDiv);
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }
      });
    </script>
</body>
    </html>
